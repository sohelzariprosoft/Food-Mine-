<app-search></app-search>
<app-tags></app-tags>
<app-not-found [visible]="!foods || !foods.length" resetLinkText="Reset Search">
</app-not-found>
<ul>
  <li *ngFor="let food of foods">
    <a [routerLink]="'/food/' + food.id">
      <img [src]="food.imageUrl" [alt]="food.name" />
      <div class="content">
        <div class="name">
          {{ food.name }}
        </div>
        <span class="favorite {{ food.faviroute ? '' : 'not' }}"> ❤ </span>
        <div class="stars">
          <app-star-ratings
            [stars]="food.stars"
            [size]="1.0"
          ></app-star-ratings>
        </div>
        <div class="product-item-footer">
          <div class="origins">
            <span *ngFor="let origin of food.origins">
              {{ origin }}
            </span>
          </div>
          <div class="cook-time">
            <span>🕒</span>
            {{ food.cookTime }}
          </div>
        </div>
        <div class="price">
          <span>
            {{ food.price | currency : "INR" : "symbol" : "1.2-2" }}
          </span>
        </div>
      </div>
    </a>
  </li>
</ul>
