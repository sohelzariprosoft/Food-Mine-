<ion-content [fullscreen]="true" class="ion-page">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" class="custom-back-button">
        <ion-icon name="chevron-back-outline"></ion-icon>
        <span>Back</span>
      </ion-back-button>
    </ion-buttons>
    <ion-title color="primary">FoodMine</ion-title>
  </ion-toolbar>

  <swiper-container (swiperslidechange)="onSlideChange()" #swiper effect="flip">
    <swiper-slide>
      <img src="/assets/banner1.jpeg" alt="Image 1" />
    </swiper-slide>
    <swiper-slide>
      <img src="/assets/banner2.jpeg" alt="Image 2" />
    </swiper-slide>
    <swiper-slide>
      <img src="/assets/banner3.jpeg" alt="Image 3" />
    </swiper-slide>
  </swiper-container>
  <div class="orders">
    <ion-list>
      <ion-card *ngFor="let order of orders" (click)="openOrderDetails(order)">
        <ion-card-header>
          <ion-card-subtitle>Order ID: {{ order._id }}</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          <div class="orderDivs">
            <p>
              <strong>Total Price:</strong> {{ order.totalPrice | currency }}
            </p>
            <p><strong>Payment Method:</strong> {{ order.paymentMethod }}</p>
          </div>
          <p><strong>Payment Status:</strong> {{ order.paymentStatus }}</p>
          <p>
            <strong>Created On:</strong> {{ order.created_on | date: 'medium' }}
          </p>
        </ion-card-content>
      </ion-card>
    </ion-list>
  </div>
